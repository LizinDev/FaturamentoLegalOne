name: Seguranca

# Selenium e openpyxl leem conteudo que vem de fora (paginas do Legal One e
# planilhas de terceiros). Vale saber quando aparece uma CVE nelas.
#
# Roda no agendamento e sob demanda, e nao em todo push, de proposito: uma CVE
# publicada num domingo nao deve reprovar o pull request de segunda.

on:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda, 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/seguranca.yml"

permissions:
  contents: read

jobs:
  dependencias:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pip-audit

      - run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt
